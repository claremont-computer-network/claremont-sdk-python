[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claremont"
version = "0.3.0"
description = "A minimal Python SDK for the Claremont Computer Network API"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=7.4",
    "twine>=5.1",
]

[project.scripts]
claremont = "claremont.__main__:main"

[project.urls]
Homepage = "https://github.com/claremont-computer-network/claremont-sdk-python"
Repository = "https://github.com/claremont-computer-network/claremont-sdk-python"
Documentation = "https://claremontcomputer.net/docs"
Issues = "https://github.com/claremont-computer-network/claremont-sdk-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/claremont"]

[tool.pytest.ini_options]
testpaths = ["tests"]
